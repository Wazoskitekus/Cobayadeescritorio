# Compila Tamacuychi para Windows:
#   - Tamacuychi-instalador-X.Y.Z.exe  (instalador con Inno Setup)
#   - Tamacuychi-portable.exe          (un solo .exe, sin instalar)
# En cada push a main se publican en "Releases" con la versión de
# tamacuychi/__init__.py (__version__): para sacar una versión nueva basta con
# subir ese número. Si la versión no cambia, se actualizan los archivos de la
# misma Release.
name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versión
        shell: bash
        run: |
          V=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('tamacuychi/__init__.py').read()).group(1))")
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Dependencias
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Comprobar que arranca la lógica
        run: python -c "import tamacuychi.arte as a, tamacuychi.mascota, tamacuychi.papelera; print(len(a.catalogo()), 'sprites')"

      - name: Icono
        run: python herramientas/exportar_sprites.py

      - name: Compilar (carpeta para el instalador)
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Tamacuychi
          --icon icono.ico --add-data "sprites;sprites"
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtPdf --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtNetwork --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --exclude-module PySide6.QtOpenGL --exclude-module PySide6.QtSvg --exclude-module tkinter
          tamacuychi.pyw

      - name: Probar que el .exe se conecta a GitHub (actualizaciones)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Tamacuychi\Tamacuychi.exe" -ArgumentList "--prueba-actualizacion","prueba.txt" -Wait -PassThru
          Get-Content prueba.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Compilar (portable, un solo .exe)
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name Tamacuychi-portable
          --icon icono.ico --add-data "sprites;sprites"
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtPdf --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtNetwork --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --exclude-module PySide6.QtOpenGL --exclude-module PySide6.QtSvg --exclude-module tkinter
          tamacuychi.pyw

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DVersion=$env:VERSION" instalador.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Tamacuychi-windows-${{ env.VERSION }}
          path: |
            dist/Tamacuychi-instalador-*.exe
            dist/Tamacuychi-portable.exe

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Tamacuychi ${{ env.VERSION }}
          body: |
            **Para instalar:** descarga `Tamacuychi-instalador-${{ env.VERSION }}.exe` y ábrelo.
            No pide permisos de administrador. Si Windows muestra "Windows protegió su PC",
            pulsa *Más información* → *Ejecutar de todas formas* (el programa no está firmado).

            **Sin instalar:** `Tamacuychi-portable.exe` funciona con doble clic.
          files: |
            dist/Tamacuychi-instalador-*.exe
            dist/Tamacuychi-portable.exe
